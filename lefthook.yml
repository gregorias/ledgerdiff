pre-commit:
  commands:
    black:
      tags: style
      glob: "*.py"
      run: uv run black {staged_files} && git add {staged_files}
    markdownlint:
      tags: documentation style
      files: git diff --name-only --cached --diff-filter=AM
      glob: "*.md"
      run: markdownlint {files}
    mypy:
      tags: test
      run: uv run mypy src tests
    pyproject-toml-check:
      tags: lint
      glob: "pyproject.toml"
      run: uv run validate-pyproject pyproject.toml
    ruff:
      tags: lint
      glob: "*.py"
      run: uv run ruff check {staged_files}
    ruff-imports:
      tags: style import
      glob: "*.py"
      run: uv run ruff check --select=I001 --fix {staged_files}
      stage_fixed: true
    toml-taplo-lint:
      tags: style
      glob: "*.toml"
      run: taplo check {staged_files}
    toml-taplo-fmt:
      tags: style
      glob: "*.toml"
      run: taplo fmt --check {staged_files}
    unit-tests:
      tags: test
      run: uv run python -m unittest discover tests
    uv-check:
      tags: lint
      glob: "{pyproject.toml,uv.lock}"
      run: uv pip check
    vulture:
      tags: lint
      run: uv run vulture src tests
    yaml-prettier:
      tags: style
      glob: "*.{yml,yaml}"
      run: prettier -c {staged_files}
commit-msg:
  commands:
    commitlint:
      run: "commitlint --edit={1}"
post-checkout:
  commands:
    uv-sync:
      run: uv sync --locked
